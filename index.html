<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planetary Boundaries / Spatial Audit</title>
  <link rel="icon" href="data:," />
</head>
<body>
  <header>
    <div><h1>Planetary Boundaries</h1><span class="muted">Spatial audit / Phase 01</span></div>
    <div class="counts"><span>9 groups</span><span>11 points</span><span class="nq">2 not quantified</span></div>
    <output id="validation-status">VALIDATING</output>
  </header>
  <main>
    <nav id="boundaries" aria-label="Boundary groups"><h2>BOUNDARIES <span>2025</span></h2><div id="group-list"></div></nav>
    <section id="viewport" aria-label="3D risk space">
      <div id="scene"></div><div id="labels"></div>
      <div class="scene-top"><span id="scene-selection">EARTH-SYSTEM FIELD</span><div class="tools">
        <button id="fit" title="Fit all data" aria-label="Fit all data"><i data-lucide="maximize"></i></button>
        <button id="reference-view" title="Frame reference shells" aria-label="Frame reference shells"><i data-lucide="scan"></i></button>
        <button id="focus" title="Focus selected quantitative point" aria-label="Focus selected quantitative point"><i data-lucide="crosshair"></i></button>
        <button id="align-group" title="Observe from selected group direction; pivot at origin" aria-label="Align group direction"><i data-lucide="compass"></i></button>
        <button id="export" title="Download validation JSON" aria-label="Download validation JSON"><i data-lucide="download"></i></button>
      </div></div>
      <div class="legend">
        <span><b class="origin-key"></b>BASELINE <strong>r=0</strong></span>
        <label><input id="pb-toggle" type="checkbox" checked><b class="pb-key"></b>PLANETARY BOUNDARY <strong>r=1</strong></label>
        <label><input id="hr-toggle" type="checkbox" checked><b class="hr-key"></b>HIGH RISK <strong>r=2</strong></label>
      </div>
      <div class="scene-bottom"><div>OBSERVATION DISTANCE <output id="camera-distance">-</output><small>camera to target / scene units</small></div><div class="toggles">
        <label><input id="lines-toggle" type="checkbox" checked>Measurement lines</label>
        <label><input id="labels-toggle" type="checkbox" checked>Group labels</label>
        <label><input id="damping-toggle" type="checkbox" checked>Damping</label>
      </div></div>
      <div id="webgl-error" role="alert" hidden></div>
    </section>
    <aside id="inspector" aria-label="Debug inspector">
      <div class="inspector-tabs" role="tablist" aria-label="Inspector layer">
        <button id="state-tab" role="tab" aria-selected="true" aria-controls="state-panel">State</button>
        <button id="observer-tab" role="tab" aria-selected="false" aria-controls="observer-panel" tabindex="-1">Observer</button>
      </div>
      <section id="state-panel" role="tabpanel" aria-labelledby="state-tab"><h2>DATA INSPECTOR</h2><div id="inspect-content"></div></section>
      <section id="observer-panel" role="tabpanel" aria-labelledby="observer-tab" hidden>
        <h2>OBSERVER FRAME</h2>
        <label class="axis-select" for="reference-axis">REFERENCE AXIS<select id="reference-axis"><option value="group">Selected boundary direction</option><option value="world-y">World +Y</option></select></label>
        <div id="observer-content"></div>
      </section>
    </aside>
  </main>
  <footer><span id="runtime-status">Loading source data</span><span>Angles: layout only / no aggregation</span></footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
